# Starship Configuration
# https://starship.rs/config/

# Prompt Format
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$docker_context\
$kubernetes\
$python\
$nodejs\
$ruby\
$rust\
$golang\
$line_break\
$character
"""

# Character Module
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# Directory Module
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# Git Branch
[git_branch]
symbol = "🌱 "
style = "bold purple"
format = "on [$symbol$branch]($style) "

# Git Status
[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "🏳‍🌈"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Kubernetes
[kubernetes]
symbol = "☸ "
style = "bold blue"
format = "on [$symbol$context](bold blue) "
disabled = false
detect_files = ["k8s.yaml", "k8s.yml", "kustomization.yaml"]
detect_extensions = []
detect_folders = []

# Docker
[docker_context]
symbol = "🐳 "
style = "bold blue"
format = "via [$symbol$context]($style) "
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
disabled = false

# Python
[python]
symbol = "🐍 "
style = "bold yellow"
format = "via [$symbol($version )]($style)"
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "pyproject.toml", "tox.ini", "requirements.txt"]
detect_folders = ["__pycache__"]

# Node.js
[nodejs]
symbol = "⬢ "
style = "bold green"
format = "via [$symbol($version )]($style)"
detect_extensions = ["js", "mjs", "cjs", "ts"]
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

# Ruby
[ruby]
symbol = "💎 "
style = "bold red"
format = "via [$symbol($version )]($style)"
detect_extensions = ["rb"]
detect_files = ["Gemfile", ".ruby-version"]
detect_folders = []

# Rust
[rust]
symbol = "🦀 "
style = "bold orange"
format = "via [$symbol($version )]($style)"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml", "Cargo.lock"]
detect_folders = []

# Go
[golang]
symbol = "🐹 "
style = "bold cyan"
format = "via [$symbol($version )]($style)"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]
detect_folders = []

# Line Break
[line_break]
disabled = false

# Username (only show if not default user)
[username]
show_always = false
style_user = "bold yellow"
format = "[$user]($style) "

# Hostname (only show if SSH)
[hostname]
ssh_only = true
style = "bold dimmed green"
format = "on [$hostname]($style) "

# Timeout for commands
command_timeout = 500

# Scan timeout
scan_timeout = 10

# Add other useful modules
[time]
disabled = true

[battery]
disabled = true
