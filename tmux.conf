# Tmux Configuration
# https://github.com/tmux/tmux/wiki

# General Settings
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g mouse on
set -ga terminal-overrides ",xterm-256color:RGB"

# Window & Pane Settings
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# Status Bar
set -g status-bg "#0a0e27"
set -g status-fg "#e0def4"
set -g status-left "[#S] "
set -g status-right "%H:%M %d-%b-%y"
set -g status-interval 1

# Keybindings (using Cmd key on macOS)
# Set prefix to Ctrl+Space for easier access
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# New window
bind -n M-n new-window

# Split panes (Cmd+D for vertical, Cmd+Shift+D for horizontal)
bind -n M-d split-window -h
bind -n M-D split-window -v

# Navigate panes (Cmd+Arrow keys)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes (Cmd+Alt+Arrow keys)
bind -n M-C-Left resize-pane -L 5
bind -n M-C-Right resize-pane -R 5
bind -n M-C-Up resize-pane -U 5
bind -n M-C-Down resize-pane -D 5

# Toggle synchronize-panes (Cmd+Shift+S)
# This allows you to send the same command to all panes in a window
bind -n M-S setw synchronize-panes

# New session
bind -n M-N new-session

# Kill pane/window
bind -n M-w kill-pane
bind -n M-W kill-window

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# List of sessions
bind s list-sessions

# Search in copy mode (/)
bind / copy-mode \; send-keys -X start-of-line
